<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Members</title><style>body{font-family:Arial;background:#f2f2f2;margin:0} nav{background:#6a0dad;padding:12px;display:flex;gap:12px;flex-wrap:wrap} nav a{color:#fff;text-decoration:none;font-weight:bold} .wrap{padding:20px} input,button{padding:10px;margin:5px;border:1px solid #ccc;border-radius:5px} button{background:#6a0dad;color:#fff;border:0} table{width:100%;background:#fff;border-collapse:collapse;margin-top:15px} th,td{border:1px solid #ddd;padding:8px;text-align:left}</style></head><body><nav><a href="dashboard.html">Dashboard</a><a href="members.html">Members</a><a href="purchase.html">Record Purchase</a><a href="disputes.html">Disputes</a><a href="activity.html">Activity</a><a href="reports.html">Reports</a><a href="index.html">Logout</a></nav><div class="wrap"><h2>Members</h2><input id="search" placeholder="Search member..." oninput="show()"><h3>Enrol Member</h3><form onsubmit="enrol();return false;"><input id="name" placeholder="Full Name" required><input id="phone" placeholder="Phone e.g 0756342125" required><button>Enrol Member</button></form><table><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Points</th></tr></thead><tbody id="list"></tbody></table></div><script>function getM(){return JSON.parse(localStorage.getItem('members')||'[]')}function show(){var q=document.getElementById('search').value.toLowerCase();var list=document.getElementById('list');var m=getM().filter(function(x){return x.name.toLowerCase().includes(q)||x.phone.includes(q)});list.innerHTML=m.map(function(x){return '<tr><td>'+x.id+'</td><td>'+x.name+'</td><td>'+x.phone+'</td><td>'+x.points+'</td></tr>'}).join('')||'<tr><td colspan=4>No members yet</td></tr>'}function enrol(){var n=document.getElementById('name').value;var ph=document.getElementById('phone').value;var m=getM();m.push({id:'PT-'+(100+m.length),name:n,phone:ph,points:0});localStorage.setItem('members',JSON.stringify(m));alert(n+' enrolled!');document.getElementById('name').value='';document.getElementById('phone').value='';show()}show()</script></body></html>
