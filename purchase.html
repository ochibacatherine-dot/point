ers[idx].name,amount:amt,points:pts});members[idx].points=Number(members[idx].points||0)+pts;localStorage.setItem('members',JSON.stringify(members));localStorage.setItem('purchases',JSON.stringify(p));document.getElementById('msg').innerText='Saved! '+members[idx].name+' earned '+pts+' points';showP()}showP()</script></body></html>
