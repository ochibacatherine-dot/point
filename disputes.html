<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disputes</title><style>body{font-family:Arial;background:#f2f2f2;margin:0} nav{background:#6a0dad;padding:12px;display:flex;gap:12px;flex-wrap:wrap} nav a{color:#fff;text-decoration:none;font-weight:bold} .wrap{padding:20px} input,select,textarea,button{padding:10px;margin:5px;border:1px solid #ccc;border-radius:5px;width:100%;box-sizing:border-box} button{background:#6a0dad;color:#fff;border:0} table{width:100%;background:#fff;border-collapse:collapse;margin-top:15px} th,td{border:1px solid #ddd;padding:8px;text-align:left}</style></head><body><nav><a href="dashboard.html">Dashboard</a><a href="members.html">Members</a><a href="purchase.html">Record Purchase</a><a href="disputes.html">Disputes</a><a href="activity.html">Activity</a><a href="reports.html">Reports</a><a href="index.html">Logout</a></nav><div class="wrap"><h2>Disputes</h2><form onsubmit="addDispute();return false;"><input id="dname" placeholder="Member Name" required><select id="dtype"><option>Points Missing</option><option>Wrong Points</option><option>Redemption Issue</option><option>Other</option></select><textarea id="ddesc" placeholder="Describe dispute..." required></textarea><button>Submit Dispute</button></form><table><thead><tr><th>Member</th><th>Type</th><th>Description</th><th>Status</th><th>Action</th></tr></thead><tbody id="dlist"></tbody></table></div><script>function getD(){return JSON.parse(localStorage.getItem('disputes')||'[]')}function show(){document.getElementById('dlist').innerHTML=getD().map(function(x,i){return '<tr><td>'+x.name+'</td><td>'+x.type+'</td><td>'+x.desc+'</td><td>'+x.status+'</td><td><button onclick="resolve('+i+')">Resolve</button></td></tr>'}).join('')||'<tr><td colspan=5>No disputes</td></tr>'}function addDispute(){var d=getD();d.push({name:document.getElementById('dname').value,type:document.getElementById('dtype').value,desc:document.getElementById('ddesc').value,status:'Open'});localStorage.setItem('disputes',JSON.stringify(d));alert('Dispute submitted!');show()}function resolve(i){var d=getD();d[i].status='Resolved';localStorage.setItem('disputes',JSON.stringify(d));show()}show()</script></body></html>
