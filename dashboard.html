<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><style>body{font-family:Arial;background:#f2f2f2;margin:0} nav{background:#6a0dad;padding:12px;display:flex;gap:12px;flex-wrap:wrap} nav a{color:#fff;text-decoration:none;font-weight:bold} .wrap{padding:20px} .cards{display:flex;gap:12px;flex-wrap:wrap} .card{background:#fff;padding:18px;border-radius:10px;min-width:140px;flex:1;text-align:center;box-shadow:0 0 8px #ddd} .card b{font-size:28px;color:#6a0dad}</style></head><body><nav><a href="dashboard.html">Dashboard</a><a href="members.html">Members</a><a href="purchase.html">Record Purchase</a><a href="disputes.html">Disputes</a><a href="activity.html">Activity</a><a href="reports.html">Reports</a><a href="index.html">Logout</a></nav><div class="wrap"><h2>Dashboard - Welcome Admin</h2><div class="cards"><div class="card"><div>Total Members</div><b id="mCount">0</b></div><div class="card"><div>Total Purchases</div><b id="pCount">0</b></div><div class="card"><div>Total Points</div><b id="ptCount">0</b></div><div class="card"><div>Disputes</div><b>0</b></div></div><h3>Recent Activity</h3><div id="act" style="background:#fff;padding:15px;border-radius:10px">No activity yet. Enrol a member to start.</div></div><script>var m=JSON.parse(localStorage.getItem('members')||'[]');var p=JSON.parse(localStorage.getItem('purchases')||'[]');document.getElementById('mCount').innerText=m.length;document.getElementById('pCount').innerText=p.length;var pts=0;m.forEach(function(x){pts+=Number(x.points||0)});document.getElementById('ptCount').innerText=pts;if(m.length>0){document.getElementById('act').innerHTML=m.map(function(x){return x.name+' - '+x.phone+' - '+x.points+' pts'}).join('<br>')}</script></body></html>
