<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports</title><style>body{font-family:Arial;background:#f2f2f2;margin:0} nav{background:#6a0dad;padding:12px;display:flex;gap:12px;flex-wrap:wrap} nav a{color:#fff;text-decoration:none;font-weight:bold} .wrap{padding:20px} .cards{display:flex;gap:12px;flex-wrap:wrap} .card{background:#fff;padding:18px;border-radius:10px;min-width:140px;flex:1;text-align:center} .card b{font-size:28px;color:#6a0dad} table{width:100%;background:#fff;border-collapse:collapse;margin-top:15px} th,td{border:1px solid #ddd;padding:8px} button{padding:10px;background:#6a0dad;color:#fff;border:0;border-radius:5px}</style></head><body><nav><a href="dashboard.html">Dashboard</a><a href="members.html">Members</a><a href="purchase.html">Record Purchase</a><a href="disputes.html">Disputes</a><a href="activity.html">Activity</a><a href="reports.html">Reports</a><a href="index.html">Logout</a></nav><div class="wrap"><h2>Reports</h2><div class="cards"><div class="card"><div>Total Members</div><b id="mCount">0</b></div><div class="card"><div>Total Purchases</div><b id="pCount">0</b></div><div class="card"><div>Total Sales</div><b id="sales">0</b></div><div class="card"><div>Total Points Given</div><b id="pts">0</b></div></div><h3>Top Members</h3><table><thead><tr><th>Name</th><th>Phone</th><th>Points</th></tr></thead><tbody id="top"></tbody></table><br><button onclick="window.print()">Print Report</button></div><script>var m=JSON.parse(localStorage.getItem('members')||'[]');var p=JSON.parse(localStorage.getItem('purchases')||'[]');document.getElementById('mCount').innerText=m.length;document.getElementById('pCount').innerText=p.length;var sales=0,pts=0;p.forEach(function(x){sales+=Number(x.amount);pts+=Number(x.points)});document.getElementById('sales').innerText=sales;document.getElementById('pts').innerText=pts;m.sort(function(a,b){return b.points-a.points});document.getElementById('top').innerHTML=m.map(function(x){return '<tr><td>'+x.name+'</td><td>'+x.phone+'</td><td>'+x.points+'</td></tr>'}).join('')||'<tr><td colspan=3>No members yet</td></tr>'</script></body></html>
