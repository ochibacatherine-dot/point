<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity Log</title><style>body{font-family:Arial;background:#f2f2f2;margin:0} nav{background:#6a0dad;padding:12px;display:flex;gap:12px;flex-wrap:wrap} nav a{color:#fff;text-decoration:none;font-weight:bold} .wrap{padding:20px} table{width:100%;background:#fff;border-collapse:collapse} th,td{border:1px solid #ddd;padding:8px;text-align:left} button{padding:10px;background:#6a0dad;color:#fff;border:0;border-radius:5px}</style></head><body><nav><a href="dashboard.html">Dashboard</a><a href="members.html">Members</a><a href="purchase.html">Record Purchase</a><a href="disputes.html">Disputes</a><a href="activity.html">Activity</a><a href="reports.html">Reports</a><a href="index.html">Logout</a></nav><div class="wrap"><h2>Activity Log</h2><button onclick="clearAll()">Clear All Data</button><table><thead><tr><th>Activity</th></tr></thead><tbody id="alist"></tbody></table></div><script>var m=JSON.parse(localStorage.getItem('members')||'[]');var p=JSON.parse(localStorage.getItem('purchases')||'[]');var d=JSON.parse(localStorage.getItem('disputes')||'[]');var html='';m.forEach(function(x){html+='<tr><td>Enrolled: '+x.name+' ('+x.phone+') - '+x.points+' pts</td></tr>'});p.forEach(function(x){html+='<tr><td>Purchase: '+x.name+' spent '+x.amount+' earned '+x.points+' pts</td></tr>'});d.forEach(function(x){html+='<tr><td>Dispute: '+x.name+' - '+x.type+' - '+x.status+'</td></tr>'});document.getElementById('alist').innerHTML=html||'<tr><td>No activity yet</td></tr>';function clearAll(){if(confirm('Clear all demo data?')){localStorage.clear();location.reload()}}</script></body></html>
